<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Pink Heart Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    
    <!-- Gold Crown/Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Outer Soft Pink Glow Circle -->
  <circle cx="50" cy="50" r="46" fill="#fce7f3" opacity="0.9" />

  <!-- Sparkling Golden Compass Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 4" opacity="0.85" />

  <!-- Puffy Glowing Pink Heart in Center -->
  <path fill="url(#pinkGrad)" filter="url(#glow)" d="M 50 80 C 15 52, 10 28, 30 18 C 42 12, 50 24, 50 24 C 50 24, 58 12, 70 18 C 90 28, 85 52, 50 80 Z" />

  <!-- Cute White Shine Highlight on Heart -->
  <ellipse cx="36" cy="28" rx="5" ry="9" fill="#ffffff" opacity="0.75" transform="rotate(-25 36 28)" />

  <!-- Golden Crown / Star Sparkle at Top Right -->
  <path fill="url(#goldGrad)" d="M 72 15 L 75 22 L 82 25 L 75 28 L 72 35 L 69 28 L 62 25 L 69 22 Z" filter="url(#glow)" />
</svg>